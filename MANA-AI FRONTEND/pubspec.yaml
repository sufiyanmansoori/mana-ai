name: mana_ai_app
description: Mana AI chat application built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  dio: ^5.4.3
  connectivity_plus: ^6.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  drift: ^2.28.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  image_picker: ^1.1.1
  file_picker: ^8.0.3
  record: ^7.1.2
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  intl: ^0.20.3
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  share_plus: ^12.0.2
  local_auth: ^2.2.0
  package_info_plus: ^8.0.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.6.4
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.28.0
  mocktail: ^1.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
